[package]
name = "mt-mnemonic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Doors for test vectors and conformance. Not enabled in a production build, and then
# the library physically contains no functions that accept entropy from outside.
default = []
vectors = []

[dependencies]
mt-codec = { path = "../mt-codec" }
sha2 = { workspace = true }
zeroize = { workspace = true, features = ["alloc"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "=0.2.15", default-features = false, features = ["js"] }
# The page's clocks (src/clock.rs): performance.now() and Date.now(), where std has none.
js-sys = "=0.3.97"
wasm-bindgen = "=0.2.120"

[dev-dependencies]
mt-crypto = { path = "../mt-crypto" }
